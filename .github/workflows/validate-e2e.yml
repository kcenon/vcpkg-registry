name: E2E Port Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 03:17 UTC fresh-download run.
    # Forces every install to re-download the GitHub release archive and
    # re-verify SHA512 against the value in portfile.cmake. All events use
    # fresh builds so the same consumer path is exercised before merging.
    #
    # Background: kcenon/common_system#674 (parent EPIC) and
    # kcenon/vcpkg-registry#87 (the audit that revealed all 8 ports had
    # silent SHA512 mismatches because cache hits skip SHA verification).
    # See kcenon/vcpkg-registry#93 for the no-cache mode rationale.
    - cron: '17 3 * * *'

env:
  # Fresh downloads and builds verify the archive hashes on every platform.
  VCPKG_BINARY_SOURCES: clear
  # Tool/scripts revision with the MSYS2 refresh (microsoft/vcpkg#54128).
  VCPKG_TOOL_COMMIT: 2200159cd465157f20133e363e4604ac4d68181b
  # Keep dependency versions independent from the tool/scripts upgrade.
  VCPKG_BUILTIN_BASELINE: b02e341c927f16d991edbd915d8ea43eac52096c
  REGISTRY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  e2e-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        port:
          - kcenon-common-system
          - kcenon-thread-system
          - kcenon-logger-system
          - kcenon-container-system
          - kcenon-monitoring-system
          - kcenon-database-system
          - kcenon-network-system
          - kcenon-pacs-system
        exclude:
          # These ports fail on Windows due to upstream library linker errors
          # that are outside the scope of this vcpkg registry to fix.
          - os: windows-latest
            port: kcenon-logger-system
          - os: windows-latest
            port: kcenon-network-system
          - os: windows-latest
            port: kcenon-pacs-system

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.port }} (${{ matrix.os }})
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REGISTRY_COMMIT }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool autoconf-archive

      - name: Set macOS SDK environment
        if: runner.os == 'macOS'
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion)" >> $GITHUB_ENV

      - name: Check out pinned vcpkg tools
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_TOOL_COMMIT }}
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DOWNLOADS=$RUNNER_TEMP/fresh-downloads" >> "$GITHUB_ENV"
          ./vcpkg/vcpkg version

      - name: Determine triplet
        id: triplet
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   echo "value=x64-linux"   >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "value=arm64-osx"    >> "$GITHUB_OUTPUT" ;;
            Windows) echo "value=x64-windows"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create external registry consumer
        shell: bash
        env:
          PORT: ${{ matrix.port }}
        run: |
          python scripts/create_e2e_consumer.py "$RUNNER_TEMP/registry-consumer"
          echo "CONSUMER_ROOT=$RUNNER_TEMP/registry-consumer" >> "$GITHUB_ENV"
          echo "Registry: $REGISTRY_COMMIT; tools: $VCPKG_TOOL_COMMIT; builtin: $VCPKG_BUILTIN_BASELINE"

      - name: Install port from Git registry (no cache)
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$CONSUMER_ROOT" \
            --triplet="${{ steps.triplet.outputs.value }}" \
            --x-install-root="$CONSUMER_ROOT/vcpkg_installed"

      - name: Configure CMake test project
        shell: bash
        run: |
          cmake -B "$CONSUMER_ROOT/build" -S "$CONSUMER_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.triplet.outputs.value }}" \
            -DVCPKG_INSTALLED_DIR="$CONSUMER_ROOT/vcpkg_installed"

      - name: Build test project
        shell: bash
        run: |
          cmake \
            --build "$CONSUMER_ROOT/build" \
            --config Release

      - name: Run test binary
        shell: bash
        run: |
          ctest \
            --test-dir "$CONSUMER_ROOT/build" \
            --build-config Release \
            --output-on-failure --no-tests=error

      - name: Upload install and consumer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.port }}-${{ matrix.os }}
          path: |
            vcpkg/buildtrees/**/*.log
            ${{ runner.temp }}/registry-consumer/build/Testing/Temporary/
            ${{ runner.temp }}/registry-consumer/vcpkg*.json
            ${{ runner.temp }}/registry-consumer/vcpkg_installed/vcpkg/status
